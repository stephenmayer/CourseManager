<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="470" viewBox="0 0 1220 470" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker></defs>
<rect width="1220" height="470" fill="#ffffff"/>
<text x="40" y="48" text-anchor="start" font-size="22" font-weight="700" fill="#1f2937">Two writers, one rule: staff never edit SIS data, the sync never overwrites staff edits</text>
<rect x="40" y="190" width="240" height="110" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
<text x="160.0" y="241.0" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2937">Sync job</text>
<text x="160.0" y="267.0" text-anchor="middle" font-size="15" fill="#6b7280">nightly or &quot;sync now&quot;</text>
<rect x="470" y="100" width="280" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="610.0" y="151.0" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2937">SIS imports</text>
<text x="610.0" y="177.0" text-anchor="middle" font-size="15" fill="#6b7280">read-only, one per sync</text>
<rect x="470" y="290" width="280" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="610.0" y="341.0" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2937">Course requests</text>
<text x="610.0" y="367.0" text-anchor="middle" font-size="15" fill="#6b7280">the only thing staff edit</text>
<rect x="940" y="190" width="240" height="110" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
<text x="1060.0" y="241.0" text-anchor="middle" font-size="19" font-weight="600" fill="#1f2937">Counselor app</text>
<text x="1060.0" y="267.0" text-anchor="middle" font-size="15" fill="#6b7280">React + FastAPI</text>
<line x1="284" y1="225" x2="466" y2="160" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>
<text x="355.0" y="166.5" text-anchor="middle" font-size="14" fill="#6b7280">writes a new import</text>
<line x1="284" y1="265" x2="466" y2="340" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>
<text x="355.0" y="338.5" text-anchor="middle" font-size="14" fill="#6b7280">merges SIS changes</text>
<line x1="936" y1="225" x2="754" y2="160" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>
<text x="865.0" y="166.5" text-anchor="middle" font-size="14" fill="#6b7280">reads the current one</text>
<line x1="936" y1="265" x2="754" y2="340" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/>
<text x="865.0" y="338.5" text-anchor="middle" font-size="14" fill="#6b7280">edits</text>
<text x="40" y="442" text-anchor="start" font-size="15" font-weight="400" fill="#6b7280">The app and the sync share a database but no code.</text>
</svg>