<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Course dialog from a student page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}</style>
</helmet>
<div style="position: relative; min-height: 1240px; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: {{t.text}}">
  <dc-import name="StudentDetail" hint-size="100%,1240px"></dc-import>
  <div style="position: absolute; inset: 0; background: {{t.scrim}}; display: flex; justify-content: center; align-items: flex-start; padding: 140px 16px 16px; box-sizing: border-box">
    <div role="dialog" aria-modal="true" aria-labelledby="sel-h" style="position: relative; width: 100%; max-width: 560px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 24px; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.border}}; box-shadow: 0 24px 64px rgba(0,0,0,0.28)">
      <a href="StudentDetail.dc.html" aria-label="Close" style="position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid {{t.borderStrong}}; background: {{t.surface}}; color: {{t.text}}; font-size: 16px; text-decoration: none">✕</a>
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: {{t.muted}}; padding-right: 56px">REQUESTS FOR THIS COURSE</div>
      <h2 id="sel-h" style="margin: 0; font-size: 22px; font-weight: 700">MTH101 Algebra I</h2>
      <div style="color: {{t.muted}}">Math · grade 9 · 3 requests (3 priority)</div>

      <sc-for list="{{reqs}}" as="r" hint-placeholder-count="3">
        <div style="{{r.boxStyle}}">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
            <span style="font-weight: 600; flex-grow: 1">{{r.name}} <span style="font-weight: 400; color: {{t.muted}}">· grade {{r.grade}}</span></span>
            <span style="{{pillP}}">Priority</span>
          </div>
          <sc-if value="{{r.note}}" hint-placeholder-val="{{false}}">
            <div style="color: {{t.warnText}}">{{r.note}}</div>
          </sc-if>
          <div style="display: flex; gap: 8px">
            <button type="button" style="{{btn}}">Make elective</button>
            <button type="button" style="{{btn}}">Remove</button>
          </div>
        </div>
      </sc-for>

      <p style="margin: 0; font-size: 12px; color: {{t.muted}}">Same dialog as on the Courses page. Changes here are the same as editing on each student's page.</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const t = {
      surface: '#FFFFFF', text: '#1A1D23', muted: '#5B6270', border: '#E2E5EA', borderStrong: '#B8BEC8',
      accentSoft: '#EAF0FC', accentText: '#1D4AAA', warnBg: '#FFF8EB', warnBorder: '#F5C26B', warnText: '#93370D',
      scrim: 'rgba(16,24,40,0.45)'
    };
    const btn = `height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid ${t.borderStrong}; background: ${t.surface}; color: ${t.text}; font: inherit`;
    const pillP = `display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: ${t.accentSoft}; color: ${t.accentText}`;
    const box = (warn) => `display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 10px; ${warn ? `background: ${t.warnBg}; border: 1px solid ${t.warnBorder}` : `border: 1px solid ${t.border}`}`;
    const reqs = [
      { name: 'Alex Rivera', grade: 9, note: '' },
      { name: 'Mei Chen', grade: 9, note: '' },
      { name: 'Jordan Williams', grade: 10, note: 'Out of grade, kept with reason: "Retake: failed Algebra I last year"' }
    ].map((r) => ({ ...r, boxStyle: box(!!r.note) }));
    return { t, btn, pillP, reqs };
  }
}
</script>
</body>
</html>
